id: in.co.nandakumar.vara
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: vara
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
rename-icon: "vara"
rename-desktop-file: "vara.desktop"
modules:
  - name: vara
    buildsystem: simple
    build-commands:
      - make -C src uncomment-flatpak-specific
      - make
      - PREFIX=/app make install
    sources:
      - type: archive
        url: https://nandakumar.co.in/software/vara/downloads/0.1/vara-0.1.260926.tar.gz
        sha256: c5c1332bb06376030889f31fc9ea5855f12ba2b26b4bab994a6dd4c79707279a
