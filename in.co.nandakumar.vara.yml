id: in.co.nandakumar.vara
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: vara
finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --share=ipc
rename-icon: "vara"
rename-desktop-file: "vara.desktop"
modules:
  - name: vara
    buildsystem: simple
    build-commands:
      - make -C src uncomment-flatpak-specific
      - make
      - PREFIX=/app make install
    sources:
      - type: archive
        url: https://nandakumar.co.in/software/vara/downloads/0.1/vara-0.1.251018.tar.gz
        sha256: 0cac3edabacea2ba6c384657050af68a33b498c600ed61ab2fba93aeb85a4b73
